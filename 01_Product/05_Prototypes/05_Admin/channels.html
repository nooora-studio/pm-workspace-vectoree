<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模型渠道 — Vectoree Admin</title>
  <link rel="icon" type="image/svg+xml" href="../_Assets/vee-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../_Assets/tokens.css">
  <link rel="stylesheet" href="../_Assets/layout.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; }
    body { font-family: var(--font-body); background: var(--paper); color: var(--ink); font-size: var(--fs-md); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }
    .icon-btn { width: 30px; height: 30px; border: 2px solid var(--ink); background: var(--white); color: var(--ink); display: grid; place-items: center; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); }
    .icon-btn:hover { background: var(--acid-soft); }
    .icon-btn--danger:hover { background: #ffe5e5; }
  </style>
</head>
<body>

  <div class="app">

    <!-- ════ Admin Sidebar ════ -->
    <aside class="sidebar">
      <div class="sidebar__group">
        <div class="sidebar__group-title">运营</div>
        <ul class="sidebar__list">
          <li><a class="sidebar__link" href="index.html">
            <svg class="sidebar__icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
            概览
          </a></li>
        </ul>
      </div>

      <div class="sidebar__group">
        <div class="sidebar__group-title">模型运营</div>
        <ul class="sidebar__list">
          <li><a class="sidebar__link sidebar__link--active" href="channels.html">
            <svg class="sidebar__icon" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 6h8M8 18h8M7 7l4 4M17 7l-4 4M7 17l4-4M17 17l-4-4"/></svg>
            模型渠道
          </a></li>
          <li><a class="sidebar__link" href="models.html">
            <svg class="sidebar__icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
            模型
          </a></li>
          <li><a class="sidebar__link" href="routing-policies.html">
            <svg class="sidebar__icon" viewBox="0 0 24 24"><path d="M3 7h7l3 5h8M3 17h7l3-5h8"/><path d="M14 9l3 3-3 3"/></svg>
            模型调度策略
          </a></li>
          <li><a class="sidebar__link" href="fault-tolerance.html">
            <svg class="sidebar__icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>
            容错策略
          </a></li>
          <li><a class="sidebar__link" href="logs.html">
            <svg class="sidebar__icon" viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg>
            Logs
          </a></li>
        </ul>
      </div>

      <div class="sidebar__group">
        <div class="sidebar__group-title">租户</div>
        <ul class="sidebar__list">
          <li><a class="sidebar__link" href="organizations.html">
            <svg class="sidebar__icon" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            组织列表
          </a></li>
          <li><a class="sidebar__link" href="billing-reconciliation.html">
            <svg class="sidebar__icon" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
            对账管理
          </a></li>
        </ul>
      </div>

      <div class="sidebar__footer">
        <a class="sidebar__back" href="../index.html">← 返回 Vectoree</a>
      </div>
    </aside>

    <!-- ════ Main ════ -->
    <div class="app__main">

      <header class="topbar">
        <a class="topbar__brand" href="../index.html">
          <span class="topbar__logo">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <rect x="10" y="12" width="3" height="6" fill="#101010"/>
              <rect x="19" y="12" width="3" height="6" fill="#101010"/>
              <rect x="12" y="22" width="8" height="2" fill="#101010"/>
              <rect x="13" y="4" width="6" height="3" fill="#101010"/>
              <rect x="15" y="1" width="2" height="4" fill="#101010"/>
            </svg>
          </span>
          <span class="topbar__wordmark">Vectoree</span>
        </a>
        <div class="topbar__switchers"><span class="topbar__switcher topbar__switcher--admin">Admin</span></div>
        <div class="topbar__spacer"></div>
        <div class="topbar__actions">
          <div class="topbar__lang">
            <button data-lang="en">EN</button>
            <button class="active" data-lang="zh">中文</button>
          </div>
          <span class="topbar__switcher" style="background: var(--acid); border-color: var(--ink);">ENV · PROD</span>
          <span class="topbar__user">local:admin</span>
          <div class="topbar__avatar">L</div>
          <button class="topbar__logout" title="Logout">⏻</button>
        </div>
      </header>

      <main class="content">
        <div class="page-header">
          <div>
            <h1 class="page-title">
              <svg class="page-title__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color: var(--ink);">
                <circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="12" r="2"/>
                <circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>
                <path d="M8 6h8M8 18h8M7 7l4 4M17 7l-4 4M7 17l4-4M17 17l-4-4"/>
              </svg>
              模型渠道
            </h1>
            <p class="page-sub">管理上游模型渠道。每个渠道可挂载多个轮询密钥，通过统一网关为 Agent Factory 提供服务。</p>
          </div>
          <div class="page-actions">
            <button class="btn btn--primary">+ 添加渠道</button>
          </div>
        </div>

        <div class="card" style="padding: 0;">
          <table class="table">
            <thead>
              <tr>
                <th>名称</th>
                <th>类型</th>
                <th>健康状态</th>
                <th>优先级</th>
                <th>权重</th>
                <th>密钥</th>
                <th>已启用</th>
                <th style="text-align: right; width: 180px;">操作</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>
                  <div class="channel-name">
                    <span class="channel-name__main">OpenRouter</span>
                    <span class="channel-name__sub">openrouter</span>
                  </div>
                </td>
                <td><span class="mono">OpenRouter</span></td>
                <td><span class="badge badge--ok">正常</span></td>
                <td class="num">100</td>
                <td class="num">100</td>
                <td><span class="mono">1/1 已启用</span></td>
                <td>
                  <label class="toggle"><input type="checkbox" checked><span class="toggle__track"><span class="toggle__knob"></span></span></label>
                </td>
                <td>
                  <div class="table__actions">
                    <button class="icon-btn" title="连通性测试">📶</button>
                    <button class="icon-btn" title="编辑">✎</button>
                    <button class="icon-btn" title="密钥管理">🔑</button>
                    <button class="icon-btn icon-btn--danger" title="删除">🗑</button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script>
    document.querySelectorAll('.topbar__lang').forEach(g => {
      g.addEventListener('click', (ev) => {
        const btn = ev.target.closest('button');
        if (!btn) return;
        g.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
      });
    });
  </script>
</body>
</html>
