<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vectoree Onboarding Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            acid: '#C8FF00',
            'acid-hover': '#b8ec00',
            ink: '#e5e5e5',
            'ink-dim': '#888888',
            canvas: '#0a0a0a',
            surface: '#111111',
            card: '#141414',
            line: '#2a2a2a',
            'line-soft': '#333333',
            emerald: { 300: '#34d399', 400: '#10b981' },
            destructive: '#ef4444',
            amber: { 400: '#fbbf24' },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['IBM Plex Mono', 'monospace'],
            display: ['Inter', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'hard-sm': '3px 3px 0px 0px rgba(0,0,0,0.6)',
            'hard-md': '4px 4px 0px 0px rgba(0,0,0,0.6)',
          },
        },
      },
    };
  </script>
  <style>
    :root {
      --acid: #C8FF00;
      --acid-hover: #b8ec00;
    }
    body {
      background-color: #0a0a0a;
      color: #e5e5e5;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .font-display {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    @keyframes fw-particle {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      60% { opacity: 0.9; }
      100% { opacity: 0; transform: translate(var(--fw-tx), var(--fw-ty)) scale(0.15); }
    }
    @keyframes fw-fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fw-particle {
      position: absolute;
      border-radius: 9999px;
      animation: fw-particle 1.2s ease-out forwards;
      pointer-events: none;
    }
    .fade-in-up {
      animation: fw-fade-in 0.5s ease-out forwards;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    .code-block {
      border: 2px solid #2a2a2a;
      padding: 12px 16px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      line-height: 1.7;
      color: #C8FF00;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(0,0,0,0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
  </style>
</head>
<body class="min-h-screen">
  <!-- App Shell -->
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="hidden w-56 flex-shrink-0 flex-col border-r-2 border-line bg-surface md:flex">
      <div class="flex h-14 items-center border-b-2 border-line px-4">
        <span class="font-display text-sm text-ink">VECTOREE</span>
      </div>
      <nav class="flex flex-1 flex-col gap-0.5 p-2">
        <a href="#" id="nav-onboarding" class="hidden items-center gap-3 rounded px-3 py-2 text-sm font-medium text-acid">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2"/><circle cx="12" cy="12" r="9"/></svg>
          Onboarding
        </a>
        <a href="#" id="nav-dashboard" class="flex items-center gap-3 rounded px-3 py-2 text-sm text-ink">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
          Dashboard
        </a>
        <a href="#" class="flex items-center gap-3 rounded px-3 py-2 text-sm text-ink-dim hover:bg-card hover:text-ink">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          模型广场
        </a>
        <a href="#" class="flex items-center gap-3 rounded px-3 py-2 text-sm text-ink-dim hover:bg-card hover:text-ink">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          工具中心
        </a>
        <a href="#" class="flex items-center gap-3 rounded px-3 py-2 text-sm text-ink-dim hover:bg-card hover:text-ink">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
          API 密钥
        </a>
        <div class="my-1 border-t border-line"></div>
        <a href="#" class="flex items-center gap-3 rounded px-3 py-2 text-sm text-ink-dim hover:bg-card hover:text-ink">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          身份认证
        </a>
        <a href="#" class="flex items-center gap-3 rounded px-3 py-2 text-sm text-ink-dim hover:bg-card hover:text-ink">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"/></svg>
          数据库
        </a>
        <a href="#" class="flex items-center gap-3 rounded px-3 py-2 text-sm text-ink-dim hover:bg-card hover:text-ink">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/></svg>
          存储
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto bg-canvas">
      <!-- Top Bar -->
      <header class="flex h-14 items-center justify-between border-b-2 border-line bg-surface px-6">
        <div class="flex items-center gap-4">
          <span class="font-display text-sm text-ink">ICE的组织</span>
          <svg class="h-4 w-4 text-ink-dim" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
          <span class="text-sm text-ink-dim">默认项目</span>
          <svg class="h-4 w-4 text-ink-dim" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
        </div>
        <div class="flex items-center gap-3">
          <span class="text-sm text-ink-dim">EN / 中文</span>
          <button id="connect-btn" class="rounded border-2 border-line bg-card px-3 py-1.5 text-sm text-ink hover:bg-acid hover:text-black">🔌 连接</button>
        </div>
      </header>

      <!-- Demo Controls -->
      <div class="mx-auto mt-6 w-full max-w-[760px] px-6">
        <div class="flex flex-wrap items-center gap-2 rounded border-2 border-dashed border-line bg-surface p-3">
          <span class="font-mono text-[11px] text-ink-dim">Demo 控制：</span>
          <button onclick="demoReset()" class="rounded border-2 border-line bg-card px-3 py-1 text-xs font-medium text-ink hover:bg-acid hover:text-black">重置为未连接</button>
          <button onclick="demoCompleted()" class="rounded border-2 border-line bg-card px-3 py-1 text-xs font-medium text-ink hover:bg-acid hover:text-black">模拟已在 CLI 完成连接</button>
          <button onclick="demoFirstVisit()" class="rounded border-2 border-line bg-card px-3 py-1 text-xs font-medium text-ink hover:bg-acid hover:text-black">模拟新用户首次访问</button>
          <button onclick="clearStorage()" class="rounded border-2 border-line bg-card px-3 py-1 text-xs font-medium text-ink hover:bg-destructive hover:text-white">清除 localStorage</button>
        </div>
      </div>

      <!-- Page Content -->
      <div class="mx-auto w-full max-w-[760px] px-6 pb-10 pt-6">
        <div id="content-root"></div>
      </div>
    </main>
  </div>

  <!-- Modal Backdrop -->
  <div id="modal-root"></div>

  <!-- Connect Panel (right top) -->
  <div id="connect-panel-root"></div>

  <!-- Fireworks Overlay -->
  <div id="fireworks-overlay" class="pointer-events-none fixed inset-0 z-50 flex items-center justify-center overflow-hidden" style="display:none;"></div>

  <script>
    // ===================== STATE =====================
    const STORAGE_KEY = 'vectoree_onboarding_state_v2';
    const PROJECT_ID = 'proj_2l9x8m3k';
    const PROJECT_NAME = 'my-agent-demo';

    const DEFAULT_STATE = {
      onboarding_status: 'not_started', // not_started | in_progress | completed
      modal_revealed: false,
      path: null,                     // 'developer' | 'newbie'
      developer_copied: false,
      developer_verified: false,
      newbie_agent: null,
      newbie_template: null,
      newbie_verified: false,
      verification: 'idle',           // idle | loading | success | failed
      reward_shown: false,
    };

    let state = { ...DEFAULT_STATE };
    let verifyTimer = null;

    const AGENTS = [
      { id: 'claude-code', label: 'Claude Code', color: '#d4a574' },
      { id: 'cursor', label: 'Cursor', color: '#3b82f6' },
      { id: 'copilot', label: 'GitHub Copilot', color: '#a855f7' },
      { id: 'windsurf', label: 'Windsurf', color: '#06b6d4' },
      { id: 'cline', label: 'Cline', color: '#f97316' },
    ];

    const TEMPLATES = [
      { key: 'deeptutor', label: 'DeepTutor', desc: '创建我自己的 AI 学习教练' },
      { key: 'ragflow', label: 'RAGFlow', desc: '创建一个能检索我资料库的问答 Agent' },
      { key: 'deerflow', label: 'DeerFlow', desc: '创建一个能帮我调研、编程和干长任务的 Agent' },
      { key: 'librechat', label: 'LibreChat', desc: '创建一个我自己的私有 AI 聊天助手' },
    ];

    // ===================== PERSISTENCE =====================
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) state = { ...DEFAULT_STATE, ...JSON.parse(raw) };
      } catch {}
    }
    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
    }
    function clearStorage() {
      localStorage.removeItem(STORAGE_KEY);
      state = { ...DEFAULT_STATE };
      render();
    }
    function demoReset() {
      state = { ...DEFAULT_STATE, modal_revealed: true };
      saveState();
      render();
    }
    function demoCompleted() {
      state.onboarding_status = 'completed';
      state.modal_revealed = true;
      state.developer_verified = true;
      state.newbie_verified = true;
      state.path = state.path || 'developer';
      saveState();
      render();
    }
    function demoFirstVisit() {
      state = { ...DEFAULT_STATE };
      saveState();
      render();
    }

    // ===================== RENDER =====================
    function render() {
      renderNav();
      renderContent();
      renderModal();
      renderConnectPanel();
    }

    function renderNav() {
      const onbNav = document.getElementById('nav-onboarding');
      const dbNav = document.getElementById('nav-dashboard');
      if (state.onboarding_status !== 'completed') {
        onbNav.classList.remove('hidden');
        onbNav.classList.add('flex');
      } else {
        onbNav.classList.add('hidden');
        onbNav.classList.remove('flex');
      }
    }

    function renderContent() {
      const root = document.getElementById('content-root');
      if (state.onboarding_status === 'completed') {
        root.innerHTML = renderDashboard();
      } else {
        root.innerHTML = renderOnboardingTab();
      }
    }

    function renderDashboard() {
      return `
        <div class="flex flex-col gap-6">
          <div>
            <h1 class="font-display text-sm text-ink">Dashboard</h1>
            <p class="mt-1 font-mono text-[11px] text-ink-dim">数据看板</p>
          </div>
          <div class="flex gap-4 border-2 border-line bg-surface p-5">
            <div class="flex h-2.5 w-2.5 rounded-full bg-emerald-400 mt-1"></div>
            <div>
              <p class="text-sm text-ink">项目已连接</p>
              <p class="mt-1 font-mono text-[11px] text-ink-dim">Project: ${PROJECT_ID} · 状态：已连接</p>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            ${[['AI 模型调用', '128'], ['数据库表', '12'], ['存储用量', '2.4GB'], ['Tool Hub', '34']].map(([k,v]) => `
              <div class="border-2 border-line bg-card p-4">
                <p class="text-xs text-ink-dim">${k}</p>
                <p class="mt-2 text-2xl font-bold text-acid">${v}</p>
              </div>
            `).join('')}
          </div>
          <div class="rounded border-2 border-dashed border-emerald-400/50 bg-card p-4 text-center">
            <p class="text-sm text-emerald-300">🎉 欢迎额度 $5.00 已到账（组织钱包）</p>
            <p class="mt-1 font-mono text-[11px] text-ink-dim">若在 CLI 中完成，奖励通过邮件告知</p>
          </div>
        </div>
      `;
    }

    function renderOnboardingTab() {
      const current = currentStepNumber();
      const isDeveloper = state.path === 'developer';
      const isNewbie = state.path === 'newbie';
      return `
        <div class="flex flex-col gap-6">
          <div>
            <h1 class="font-display text-sm text-ink">Onboarding</h1>
            <p class="mt-1 font-mono text-[11px] text-ink-dim">帮助你把本地项目连接到 Vectoree，并领取欢迎额度</p>
          </div>

          ${state.path === null ? `
            <div class="border-2 border-dashed border-line bg-surface p-4">
              <p class="font-mono text-[11px] text-amber-400">你尚未选择路径。点击右上角「🔌 连接」重新打开向导，或选择下方身份。</p>
            </div>
          ` : ''}

          <!-- Progress -->
          <div class="flex gap-2">
            ${isDeveloper ? devStepsMeta().map(s => stepBubble(s.num, current, s.label)).join('') : ''}
            ${isNewbie ? newbieStepsMeta().map(s => stepBubble(s.num, current, s.label)).join('') : ''}
            ${state.path === null ? '<span class="font-mono text-[11px] text-ink-dim">等待选择身份</span>' : ''}
          </div>

          ${
            state.path === 'developer' ? renderDeveloperTrack() :
            state.path === 'newbie' ? renderNewbieTrack() :
            renderPathChooser()
          }
        </div>
      `;
    }

    function stepBubble(num, current, label) {
      const done = num < current;
      const active = num === current;
      const cls = done ? 'bg-emerald-400 text-black' : active ? 'bg-acid text-black' : 'bg-card text-ink-dim';
      return `<div class="flex items-center gap-2 rounded border-2 border-line px-3 py-1.5"><span class="flex h-6 w-6 items-center justify-center rounded text-xs font-bold ${cls}">${done ? '✓' : num}</span><span class="text-xs ${done || active ? 'text-ink' : 'text-ink-dim'}">${label}</span></div>`;
    }

    function devStepsMeta() {
      return [
        { num: 1, label: '复制指令' },
        { num: 2, label: '验证连接' },
      ];
    }
    function newbieStepsMeta() {
      return [
        { num: 1, label: '环境准备' },
        { num: 2, label: '选模板' },
        { num: 3, label: '验证连接' },
      ];
    }
    function currentStepNumber() {
      if (state.path === 'developer') {
        if (!state.developer_copied) return 1;
        if (!state.developer_verified) return 2;
        return 2;
      }
      if (state.path === 'newbie') {
        if (!state.newbie_agent) return 1;
        if (!state.newbie_template) return 2;
        if (!state.newbie_verified) return 3;
        return 3;
      }
      return 0;
    }

    function renderPathChooser() {
      return `
        <div class="flex flex-col gap-3">
          <p class="font-display text-sm text-ink">你打算如何开始？</p>
          <button onclick="selectPath('developer')" class="flex flex-col gap-1 border-2 border-line bg-card p-4 text-left hover:border-ink">
            <span class="text-sm font-medium text-ink">🚀 我是开发者 / 我已有代码工程</span>
            <span class="font-mono text-[11px] text-ink-dim">复制 1 秒指令，直接连接</span>
          </button>
          <button onclick="selectPath('newbie')" class="flex flex-col gap-1 border-2 border-line bg-card p-4 text-left hover:border-ink">
            <span class="text-sm font-medium text-ink">📦 我是新手 / 想从 Starter 模板开始</span>
            <span class="font-mono text-[11px] text-ink-dim">装 Agent + 选模板 + 连接验证</span>
          </button>
        </div>
      `;
    }

    function devCommand() {
      return `请作为我的开发助手，在当前项目的本地终端中帮我运行以下命令以连接 Vectoree 后端：
npx @vectoree/cli login && npx @vectoree/cli link`;
    }

    function renderDeveloperTrack() {
      const copied = state.developer_copied;
      return `
        <div class="flex flex-col gap-4">
          <div class="flex flex-col gap-2 border-2 border-ink bg-card p-4 shadow-hard-sm">
            <div class="flex items-center justify-between">
              <p class="font-mono text-[11px] text-ink-dim">Step 1 · 复制指令</p>
              ${!copied ? `<button onclick="markCopied()" class="rounded border-2 border-ink bg-acid px-3 py-1 text-xs font-medium text-black hover:bg-acid-hover">我已复制</button>` : `<span class="text-xs font-medium text-emerald-400">✓ 已复制</span>`}
            </div>
            <pre class="code-block">${devCommand()}</pre>
            <button onclick="selectPath('newbie')" class="font-mono text-[11px] text-ink-dim underline hover:text-ink">没有环境或想从模板开始？切换为新手模式</button>
          </div>

          ${copied ? renderVerifyBlock('developer') : `<p class="font-mono text-[11px] text-amber-400">请先复制指令并到编程代理中运行</p>`}
        </div>
      `;
    }

    function renderNewbieTrack() {
      const steps = [
        state.newbie_agent ? null : renderNewbieStep1(),
        state.newbie_agent && !state.newbie_template ? renderNewbieStep2() : null,
        state.newbie_agent && state.newbie_template ? renderVerifyBlock('newbie') : null,
      ].filter(Boolean).join('');
      return `<div class="flex flex-col gap-4">${steps}</div>`;
    }

    function renderNewbieStep1() {
      const cards = AGENTS.map(a => {
        const sel = state.newbie_agent === a.id;
        return `<button onclick="selectNewbieAgent('${a.id}')" class="flex flex-col items-center gap-2 border-2 p-3 ${sel ? 'border-ink bg-acid text-black' : 'border-transparent bg-card text-ink-dim hover:border-ink'}">
          <span class="flex h-10 w-10 items-center justify-center rounded text-sm font-bold" style="background:${sel ? 'rgba(0,0,0,0.15)' : a.color + '20'}; color:${sel ? '#000' : a.color};">${a.label.slice(0,2).toUpperCase()}</span>
          <span class="text-xs font-medium">${a.label}</span>
        </button>`;
      }).join('');
      return `
        <div class="flex flex-col gap-3 border-2 border-ink bg-card p-4 shadow-hard-sm">
          <p class="font-mono text-[11px] text-ink-dim">Step 1 · 环境准备：确认已安装并打开任一编程代理</p>
          <div class="flex flex-wrap gap-3">${cards}</div>
          <p class="font-mono text-[11px] text-amber-400">💡 点击选择代表你在本地已安装并打开该 Agent</p>
        </div>
      `;
    }

    function renderNewbieStep2() {
      const cards = TEMPLATES.map(t => {
        const sel = state.newbie_template === t.key;
        return `<button onclick="selectNewbieTemplate('${t.key}')" class="flex flex-col gap-0.5 border-2 px-3 py-2 text-left ${sel ? 'border-ink bg-acid text-black' : 'border-transparent bg-card text-ink-dim hover:border-ink'}">
          <span class="text-sm font-medium">${t.label}</span>
          <span class="text-[10px]">${t.desc}</span>
        </button>`;
      }).join('');
      return `
        <div class="flex flex-col gap-3 border-2 border-ink bg-card p-4 shadow-hard-sm">
          <p class="font-mono text-[11px] text-ink-dim">Step 2 · 选模板</p>
          <div class="grid grid-cols-2 gap-2">${cards}</div>
          ${state.newbie_template ? renderTemplatePrompt() : ''}
        </div>
      `;
    }

    function renderTemplatePrompt() {
      const t = TEMPLATES.find(x => x.key === state.newbie_template);
      const prompt = `set up https://vectoree.ai/SKILL.md
Clone https://github.com/HKUDS/${t.label}
Replace model serving, search, login/signup, database, and storage with Vectoree.
Follow the skill: login, link this directory, then run ai status.`;
      return `
        <div class="mt-2">
          <p class="font-mono text-[11px] text-ink-dim">一键复制提示词：</p>
          <pre class="code-block">${prompt}</pre>
        </div>
      `;
    }

    function renderVerifyBlock(track) {
      const v = state.verification;
      const canGo = track === 'developer' ? !state.developer_verified : !state.newbie_verified;
      return `
        <div class="flex flex-col gap-3 border-2 border-ink bg-card p-4 shadow-hard-sm">
          <p class="font-mono text-[11px] text-ink-dim">${track === 'developer' ? 'Step 2' : 'Step 3'} · 校验是否连接成功，领奖励</p>
          ${v === 'idle' || v === 'failed' ? `
            <button onclick="startVerify('${track}')" class="inline-flex w-fit items-center gap-2 rounded bg-emerald-300 px-4 py-2 text-sm font-medium text-black hover:bg-emerald-400">我已执行，验证连接</button>
          ` : ''}
          ${v === 'loading' ? `<p class="font-mono text-[11px] text-ink-dim">检测中…</p>` : ''}
          ${v === 'failed' ? `
            <div class="flex flex-col gap-2 border-2 border-destructive/40 bg-surface p-3">
              <p class="text-sm text-destructive">未检测到连接</p>
              <button onclick="startVerify('${track}')" class="w-fit rounded border-2 border-line bg-card px-3 py-1 text-xs text-ink hover:bg-acid hover:text-black">重试验证</button>
              <a href="https://discord.gg/vectoree" target="_blank" class="w-fit text-xs text-ink-dim underline hover:text-ink">寻求帮助 · Discord</a>
            </div>
          ` : ''}
        </div>
      `;
    }

    // ===================== MODAL =====================
    function renderModal() {
      const root = document.getElementById('modal-root');
      if (state.onboarding_status === 'completed' || state.modal_revealed) {
        root.innerHTML = '';
        return;
      }
      root.innerHTML = `
        <div class="modal-backdrop">
          <div class="w-full max-w-md border-2 border-ink bg-surface p-6 shadow-hard-md">
            <div class="flex items-start justify-between">
              <h3 class="font-display text-lg text-ink">欢迎来到 Vectoree！</h3>
              <button onclick="closeModal()" class="text-ink-dim hover:text-ink">✕</button>
            </div>
            <p class="mt-2 mb-5 font-mono text-[11px] text-ink-dim">你打算如何开始？</p>
            <div class="flex flex-col gap-3">
              <button onclick="chooseModalPath('developer')" class="flex flex-col gap-1 border-2 border-ink bg-card p-4 text-left hover:bg-acid hover:text-black">
                <span class="text-sm font-medium">🚀 我是开发者 / 我已有代码工程</span>
                <span class="font-mono text-[11px] opacity-70">复制 1 秒指令，直接连接</span>
              </button>
              <button onclick="chooseModalPath('newbie')" class="flex flex-col gap-1 border-2 border-ink bg-card p-4 text-left hover:bg-acid hover:text-black">
                <span class="text-sm font-medium">📦 我是新手 / 想从 Starter 模板开始</span>
                <span class="font-mono text-[11px] opacity-70">装 Agent + 选模板 + 连接验证</span>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function closeModal() {
      state.modal_revealed = true;
      if (state.onboarding_status === 'not_started') {
        state.onboarding_status = 'not_started';
      }
      saveState();
      render();
    }

    function chooseModalPath(path) {
      state.modal_revealed = true;
      if (state.onboarding_status === 'not_started') {
        state.onboarding_status = 'in_progress';
      }
      selectPath(path);
    }

    function selectPath(path) {
      state.path = path;
      state.onboarding_status = 'in_progress';
      saveState();
      render();
    }

    function markCopied() {
      state.developer_copied = true;
      saveState();
      render();
    }
    function selectNewbieAgent(id) {
      state.newbie_agent = id;
      saveState();
      render();
    }
    function selectNewbieTemplate(key) {
      state.newbie_template = key;
      saveState();
      render();
    }

    function startVerify(track) {
      state.verification = 'loading';
      saveState();
      render();
      if (verifyTimer) clearTimeout(verifyTimer);
      verifyTimer = setTimeout(() => {
        // demo: assume success
        state.verification = 'success';
        if (track === 'developer') state.developer_verified = true;
        if (track === 'newbie') state.newbie_verified = true;
        state.onboarding_status = 'completed';
        state.reward_shown = true;
        saveState();
        triggerFireworks();
        render();
      }, 1500);
    }

    // ===================== CONNECT PANEL =====================
    function renderConnectPanel() {
      const root = document.getElementById('connect-panel-root');
      root.innerHTML = '';
      // simplified: connect center always available via button
    }

    document.getElementById('connect-btn').addEventListener('click', () => {
      state.modal_revealed = false;
      render();
    });

    // ===================== FIREWORKS =====================
    function triggerFireworks() {
      const overlay = document.getElementById('fireworks-overlay');
      overlay.style.display = 'flex';
      overlay.innerHTML = '';
      const colors = ['#C8FF00', '#34d399', '#60a5fa', '#f472b6', '#fbbf24', '#a78bfa'];
      for (let burst = 0; burst < 3; burst++) {
        for (let i = 0; i < 12; i++) {
          const angle = ((i / 12) * Math.PI * 2) + (burst * 0.5);
          const distance = 80 + (burst * 40) + (Math.random() * 30);
          const tx = Math.cos(angle) * distance;
          const ty = Math.sin(angle) * distance;
          const color = colors[(burst * 12 + i) % colors.length];
          const delay = burst * 180;
          const size = 3 + (i % 3);
          const dot = document.createElement('div');
          dot.className = 'fw-particle';
          dot.style.cssText = `background-color:${color}; left:50%; top:50%; width:${size*2.5}px; height:${size*2.5}px; margin-left:-${size*1.25}px; margin-top:-${size*1.25}px; animation-delay:${delay}ms; --fw-tx:${tx}px; --fw-ty:${ty}px;`;
          overlay.appendChild(dot);
        }
      }
      setTimeout(() => { overlay.style.display = 'none'; overlay.innerHTML = ''; }, 2800);
    }

    // ===================== INIT =====================
    loadState();
    render();
  </script>
</body>
</html>
